[build]
  command = "npm run build"
  publish = "dist"

# Enable prerendering for better SEO (Netlify will crawl and cache your pages)
[[plugins]]
  package = "@netlify/plugin-sitemap"

# Prerender specific routes for better SEO
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Redirect sitemap.xml to dynamic function
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/dynamic-sitemap"
  status = 200
  force = true

# Redirect rules - SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for better caching and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
